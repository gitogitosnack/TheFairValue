<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銘柄一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/stock-list.css}">
    <link rel="stylesheet" th:href="@{/css/stock-list-modals.css}">
</head>
<body>
<!-- headerBar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><a th:href="@{/top}">StockAnalyzer</a></div>
            <ul class="nav-menu">
                <li><a href="#" class="active">銘柄一覧</a></li>
                <li><a href="#">マーケット情報</a></li>
                <li><a href="#">ウォッチリスト</a></li>

                <li><a href="#">設定</a></li>
            </ul>
            <div class="nav-user">
                <span class="user-name">テスト太郎 様</span>
                <button class="btn-logout">ログアウト</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <header class="page-header">
            <h1>銘柄管理ダッシュボード</h1>
        </header>

        <!-- search condition input area -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" placeholder="銘柄名・コードを入力（部分一致）" id="searchInput">
                <button class="btn btn-primary">検索</button>
                <button class="btn btn-secondary">クリア</button>
            </div>
            <div class="action-buttons">
                <button class="btn btn-export">Excel出力</button>
            </div>
        </section>

        <!-- search result display area -->
        <section class="list-section">
            <div class="list-header">
                <h2>登録銘柄一覧</h2>
                <button id="addStockBtn" class="btn btn-success">+ 新規銘柄登録</button>
            </div>

            <table class="stock-table">
                <thead>
                <tr>
                    <th>コード</th>
                    <th>銘柄名</th>
                    <th>市場</th>
                    <th>現在値</th>
                    <th></th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                    <tr th:each="stock : ${stockList}" th:data-code="${stock.id}">
                        <td>
                            <a th:href="@{/stock-detail/{code}(code=${stock.code})}" th:text="${stock.code}">
                                7203
                            </a>
                        </td>
                        <td th:text="${stock.name}">トヨタ自動車</td>
                        <td th:text="${stock.market_name}">東証プライム</td>
                        <td>2,500.5</td>
                        <td><a href="#" class="operation-link edit-link" th:data-code="${stock.code}">編集</a></td>
                        <td><a href="#" class="operation-link delete-link" th:data-code="${stock.code}">削除</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

<!--  START: Modal for edit display  -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>銘柄情報の編集</h2>
                <span class="close-btn">&times;</span>
            </div>
            <form id="editForm">
                <input type="hidden" id="modalId" name="id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>銘柄コード</label>
                        <input type="text" id="modalCode" name="code" required>
                    </div>
                    <div class="form-group">
                        <label>銘柄名</label>
                        <input type="text" id="modalName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>市場</label>
                        <select id="modalMarket_name" name="market_name">
                            <option value="東証プライム">東証プライム</option>
                            <option value="東証スタンダード">東証スタンダード</option>
                            <option value="東証グロース">東証グロース</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary close-modal">キャンセル</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
<!--  END: Modal for edit display  -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script th:src="@{/js/stock-list.js}"></script>
</body>
</html>
