<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銘柄一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#">StockAnalyzer</a>
            </div>
            <ul class="nav-menu">
                <li><a href="#" class="active">銘柄一覧</a></li>
                <li><a href="#">マーケット情報</a></li>
                <li><a href="#">ウォッチリスト</a></li>
                <li><a href="#">設定</a></li>
            </ul>
            <div class="nav-user">
                <span class="user-name">テスト太郎 様</span>
                <button class="btn-logout">ログアウト</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <header class="page-header">
            <h1>銘柄管理ダッシュボード</h1>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" placeholder="銘柄名・コードを入力（部分一致）" id="searchInput">
                <button class="btn btn-primary">検索</button>
                <button class="btn btn-secondary">クリア</button>
            </div>
            <div class="action-buttons">
                <button class="btn btn-export">Excel出力</button>
            </div>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>登録銘柄一覧</h2>
                <button class="btn btn-success">+ 新規銘柄登録</button>
            </div>

            <table class="stock-table">
                <thead>
                <tr>
                    <th>コード</th>
                    <th>銘柄名</th>
                    <th>市場</th>
                    <th>現在値</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>7203</td>
                    <td>トヨタ自動車</td>
                    <td>東証プライム</td>
                    <td>2,500.5</td>
                    <td><a href="#" class="edit-link">更新</a></td>
                </tr>
                <tr>
                    <td>9984</td>
                    <td>ソフトバンクグループ</td>
                    <td>東証プライム</td>
                    <td>6,200.0</td>
                    <td><a href="#" class="edit-link">更新</a></td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
